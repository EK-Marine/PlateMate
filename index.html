<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlateMates</title>
<meta name="description" content="Offline weightlifting tracker for up to 6 lifters on one phone.">
<meta name="theme-color" content="#C4302A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PlateMates">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E8E9E5; --card:#F8F8F5; --field:#FFFFFF; --ink:#1D2125; --muted:#5F656B; --faint:#9AA0A5;
  --line:#D2D4CF; --shadow:0 1px 2px rgba(29,33,37,.08),0 2px 8px rgba(29,33,37,.05);
  --danger:#B3261E;
  --c-red:#C4302A; --c-blue:#1E5DAA; --c-yellow:#E0A916; --c-green:#2D7A3E; --c-purple:#6A3FA0; --c-black:#3A4047;
  --accent:#C4302A; --on-accent:#FFFFFF;
  --accent-soft:color-mix(in srgb, var(--accent) 13%, var(--card));
  --accent-line:color-mix(in srgb, var(--accent) 45%, var(--line));
  --head:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:"Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15181B; --card:#20252A; --field:#171B1F; --ink:#ECEDEA; --muted:#A3A9AE; --faint:#6C7379;
    --line:#343A40; --shadow:0 1px 2px rgba(0,0,0,.35);
    --danger:#F2817A;
    --c-red:#DE4A43; --c-blue:#3D7BCB; --c-yellow:#EDBB35; --c-green:#3E9852; --c-purple:#8A61C4; --c-black:#5E6670;
    --accent-soft:color-mix(in srgb, var(--accent) 20%, var(--card));
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;min-height:100vh;overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent-line);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:20;background:var(--accent);color:var(--on-accent);
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 0px) 10px calc(var(--sal) + 0px);
  box-shadow:0 2px 10px rgba(0,0,0,.18);transition:background-color .25s ease}
.hwrap{max-width:640px;margin:0 auto}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px 8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand b{font-family:var(--head);font-weight:700;font-size:23px;letter-spacing:.3px;white-space:nowrap}
.brand .mark{width:28px;height:28px;flex:none}
.views{display:flex;background:color-mix(in srgb, var(--on-accent) 14%, transparent);border-radius:12px;padding:3px;gap:2px}
.views button{border:0;background:transparent;color:inherit;font-family:var(--head);font-weight:600;font-size:17px;
  letter-spacing:.3px;padding:6px 12px;border-radius:9px;min-height:36px;opacity:.85}
.views button[aria-current="page"]{background:var(--on-accent);color:var(--accent);opacity:1}
@media (max-width:439px){.brand b{display:none}.views{flex:1}.views button{flex:1;padding:6px 8px}}

.lifters{position:relative;display:flex;gap:8px;padding:0 12px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.lifters::-webkit-scrollbar{display:none}
.ltab{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:10px;border:0;text-align:left;
  background:color-mix(in srgb, var(--on-accent) 10%, transparent);color:inherit;border-radius:14px;
  padding:8px 12px;min-height:58px;scroll-snap-align:start;opacity:.8;
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--on-accent) 16%, transparent)}
.ltab[aria-selected="true"]{opacity:1;background:color-mix(in srgb, var(--on-accent) 22%, transparent);
  box-shadow:inset 0 0 0 2px var(--on-accent)}
.ltab .txt{min-width:0;display:flex;flex-direction:column}
.ltab .nm{font-family:var(--head);font-weight:700;font-size:21px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltab .sub{font-size:12.5px;line-height:1.2;opacity:.9;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lifters.many .ltab{flex:0 0 auto;min-width:126px;max-width:170px;padding:6px 10px;min-height:52px;gap:8px}
.lifters.many .ltab .nm{font-size:18px}
.lifters.many .ltab .sub{font-size:11.5px}
.lifters.many .plate{width:24px;height:24px}

.plate{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pc);position:relative;
  box-shadow:0 0 0 2px rgba(255,255,255,.85), 0 1px 3px rgba(0,0,0,.35)}
.plate::before{content:"";position:absolute;inset:18%;border-radius:50%;border:1.5px solid rgba(255,255,255,.45)}
.plate::after{content:"";position:absolute;inset:38%;border-radius:50%;background:#E8E9E5;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}

/* ---------- Main ---------- */
main{max-width:640px;margin:0 auto;padding:14px calc(var(--sar) + 12px) calc(var(--sab) + 110px) calc(var(--sal) + 12px)}
h2{font-family:var(--head);font-weight:700;font-size:22px;letter-spacing:.3px;margin:22px 4px 10px;text-transform:uppercase;color:var(--muted)}
h2:first-child{margin-top:4px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:2px 4px 12px;color:var(--muted);font-size:14px}
.meta b{font-family:var(--head);font-size:20px;color:var(--ink);font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;min-height:48px;padding:0 18px;
  border:0;font-family:var(--head);font-weight:700;font-size:19px;letter-spacing:.4px}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--ink);border:1.5px solid var(--accent-line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid color-mix(in srgb, var(--danger) 40%, var(--line))}
.btn.block{width:100%}
.btn.dashed{background:transparent;border:2px dashed var(--accent-line);color:var(--ink)}
.iconbtn{border:0;background:transparent;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn:active{background:var(--accent-soft)}

.empty{padding:28px 20px;text-align:center}
.empty .big{font-family:var(--head);font-weight:700;font-size:28px;margin:6px 0 4px}
.empty p{color:var(--muted);margin:0 0 18px}
.empty .mark{width:64px;height:64px;margin:0 auto}

/* ---------- Exercise cards ---------- */
.ex{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);
  border-left:6px solid var(--accent);padding:12px 12px 12px 12px;margin-bottom:14px}
.ex-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ex-title{min-width:0;padding-top:2px}
.ex h3{font-family:var(--head);font-weight:700;font-size:24px;line-height:1.1;margin:0;display:inline}
.thumb{flex:none;width:60px;height:40px;border-radius:8px;background-color:var(--line);background-image:url(exercise-photos.webp);
  background-repeat:no-repeat;background-size:calc(var(--cols) * 100%) calc(var(--rows) * 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.thumb.none{background-image:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--head);font-weight:700;font-size:17px;letter-spacing:.5px}
.ex .thumb{width:84px;height:56px;border-radius:10px}
.ex .thumb.none{font-size:22px}
.ex-left{display:flex;gap:12px;align-items:center;min-width:0}
.tag{display:inline-block;vertical-align:3px;margin-left:6px;font-size:11.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent-line);white-space:nowrap}
.tag.plain{background:transparent;border-color:var(--line);color:var(--muted)}
.last{margin:4px 0 10px;color:var(--muted);font-size:14px;line-height:1.35}
.last b{font-family:var(--head);font-weight:600;font-size:16px;color:var(--ink)}
.grid{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 48px 36px;gap:8px;align-items:center}
.grid.hdr{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.3px;margin-bottom:4px;align-items:end}
.grid.hdr span{text-align:center;line-height:1.15}
.grid.hdr .wl{text-transform:none}
.row{padding:4px 0;border-radius:10px;transition:background-color .15s}
.row.done{background:var(--accent-soft);margin:0 -6px;padding:4px 6px}
.num{font-family:var(--head);font-weight:700;font-size:20px;text-align:center;color:var(--muted)}
.row.done .num{color:var(--ink)}
.field{width:100%;height:46px;border-radius:11px;border:1.5px solid var(--line);background:var(--field);
  text-align:center;font-family:var(--head);font-weight:600;font-size:23px;padding:0 6px;-webkit-appearance:none;appearance:none}
.field::placeholder{color:var(--faint);opacity:.75;font-weight:500}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent)}
.chk{width:48px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--field);display:grid;place-items:center;color:var(--faint)}
.chk svg{width:24px;height:24px}
.chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rm{width:36px;height:46px;border:0;background:transparent;color:var(--faint);display:grid;place-items:center;border-radius:10px}
.rm svg{width:18px;height:18px}
.addset{margin-top:8px;width:100%;min-height:44px;border-radius:11px;border:1.5px dashed var(--line);background:transparent;
  font-family:var(--head);font-weight:600;font-size:18px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.addset svg{width:18px;height:18px}

/* ---------- Bottom bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb, var(--card) 94%, transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:10px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px);transition:transform .2s ease}
.bar[hidden]{display:none}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .count{flex:none;font-size:13px;color:var(--muted);line-height:1.1;white-space:nowrap}
.bar .count b{display:block;font-family:var(--head);font-weight:700;font-size:24px;color:var(--ink)}
.bar .btn{min-height:50px;padding:0 14px}
.bar .btn.primary{flex:1;min-width:0;white-space:nowrap}
body.typing .bar{transform:translateY(110%)}

/* ---------- History ---------- */
.bests{padding:4px 0}
.best{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.best:first-child{border-top:0}
.best .n{flex:1;min-width:0;font-weight:600}
.best .n small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.best .v{font-family:var(--head);font-weight:700;font-size:22px;white-space:nowrap}
.wk{margin-bottom:12px;border-left:6px solid var(--accent);padding:10px 8px 12px 14px}
.wk-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk-head .d{font-family:var(--head);font-weight:700;font-size:21px}
.wk-head .d small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.wk ul{list-style:none;margin:4px 0 0;padding:0 6px 0 0}
.wk li{padding:5px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--muted)}
.wk li:first-child{border-top:0}
.wk li b{color:var(--ink);font-weight:600;margin-right:4px}

/* ---------- Settings ---------- */
.set-sec{padding:6px 14px 14px}
.lrow{padding:12px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lline{display:flex;align-items:center;gap:10px}
.lline .field{text-align:left;font-size:21px;padding:0 12px;flex:1;min-width:0}
.swatches{display:flex;gap:8px;margin-top:10px;padding-left:38px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:0;background:var(--sc);position:relative;display:grid;place-items:center;color:#fff}
.sw svg{width:20px;height:20px}
.sw.yellow{color:#1D2125}
.sw[aria-checked="true"]{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink)}
.sw:disabled{opacity:.22}
.sw:disabled::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;background:var(--ink);transform:rotate(-45deg)}
.hint{color:var(--muted);font-size:13.5px;margin:6px 0 0}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;min-width:72px;min-height:46px;font-family:var(--head);font-weight:700;font-size:19px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.crow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .n{flex:1;min-width:0;font-weight:600}
.crow .n small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.stats{display:flex;gap:10px;margin:8px 0 14px}
.stat{flex:1;background:var(--bg);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--head);font-weight:700;font-size:26px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
.btnrow.stack{flex-direction:column}.btnrow.stack .btn{flex:none;width:100%}
.foot{text-align:center;color:var(--faint);font-size:12.5px;margin:26px 0 8px}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,14,.5);animation:fade .18s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;background:var(--card);
  border-radius:20px 20px 0 0;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;
  padding-bottom:var(--sab);box-shadow:0 -6px 30px rgba(0,0,0,.25);animation:up .22s ease}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 2px}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 0 16px}
.sh-head h3{font-family:var(--head);font-weight:700;font-size:25px;margin:0}
.sh-top{padding:6px 16px 8px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.search input{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);padding:0 12px 0 40px;font-size:17px}
.search input:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:0 14px;min-height:38px;font-weight:600;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mlist{overflow-y:auto;flex:1;min-height:120px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);
  background:transparent;padding:8px 16px;min-height:60px}
.mitem:active{background:var(--accent-soft)}
.mitem .n{flex:1;min-width:0}
.mitem .n b{display:block;font-weight:600;font-size:16.5px}
.mitem .n small{color:var(--muted);font-size:13px}
.mitem .plus{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;flex:none;color:var(--ink)}
.mitem .plus svg{width:18px;height:18px}
.noresults{padding:22px 16px;color:var(--muted);text-align:center}
.sh-foot{padding:10px 16px 12px;border-top:1px solid var(--line)}
.form{padding:10px 16px 16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.form label.lbl{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px;letter-spacing:.2px}
.form .field{text-align:left;font-family:var(--body);font-size:17px;font-weight:500;padding:0 12px}
.form select.field{background:var(--field)}
.check{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:500}
.check input{width:24px;height:24px;accent-color:var(--accent)}

/* ---------- Modal + toast ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(10,12,14,.55);animation:fade .15s ease}
.dialog{background:var(--card);border-radius:18px;max-width:400px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.dialog h3{font-family:var(--head);font-weight:700;font-size:25px;margin:0 0 6px}
.dialog p{margin:0 0 18px;color:var(--muted)}
.dialog .btnrow .btn{flex:1}
.dialog .btn.primary.danger{background:var(--danger);color:#fff;border:0}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 92px);transform:translate(-50%,20px);z-index:70;background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header id="hdr">
  <div class="hwrap">
    <div class="toprow">
      <div class="brand">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="var(--c-red)" stroke="rgba(0,0,0,.25)" stroke-width="1"/><circle cx="24" cy="24" r="14" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/><circle cx="24" cy="24" r="5" fill="#E8E9E5"/><circle cx="40" cy="40" r="23" fill="#1D2125"/><circle cx="40" cy="40" r="21" fill="var(--c-blue)"/><circle cx="40" cy="40" r="14" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/><circle cx="40" cy="40" r="5" fill="#E8E9E5"/></svg>
        <b>PlateMates</b>
      </div>
      <nav class="views" aria-label="Sections">
        <button data-act="view" data-view="log">Log</button>
        <button data-act="view" data-view="history">History</button>
        <button data-act="view" data-view="settings">Settings</button>
      </nav>
    </div>
    <div id="lifters" class="lifters" role="tablist" aria-label="Lifters"></div>
  </div>
</header>
<main id="main"></main>
<div id="bar" class="bar" hidden></div>
<div id="sheetRoot"></div>
<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>

<script>
"use strict";
/* ================= Constants ================= */
const KEY = "liftlog.v1";

function dayStart(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
function ago(iso) {
  const days = Math.round((dayStart(new Date()) - dayStart(new Date(iso))) / 864e5);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 14) return days + " days ago";
  if (days < 60) return Math.round(days / 7) + " weeks ago";
  if (days < 365) return Math.round(days / 30.4) + " months ago";
  const y = Math.round(days / 365); return y + (y === 1 ? " year ago" : " years ago");
}
function fmtDate(iso, withYear) {
  const d = new Date(iso);
  const o = { weekday:"short", month:"short", day:"numeric" };
  if (withYear || d.getFullYear() !== new Date().getFullYear()) o.year = "numeric";
  return d.toLocaleDateString(undefined, o);
}
function fmtTime(iso) { return new Date(iso).toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" }); }
function localYMD(d = new Date()) {
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

/* ================= State ================= */
function defaults() {
  return {
    v: 1, unit: "lb", active: "erik", view: "log",
    people: { erik: { name: "Erik", color: "red" }, dash: { name: "Dash", color: "yellow" } },
    order: ["erik", "dash"], custom: [], drafts: {}, log: [], gone: [], lastBackup: null
  };
}
function colorKey(c) {
  if (!c) return null;
  const s = lc(c);
  if (COLORS[s]) return s;
  for (const k of COLOR_KEYS) if (lc(COLORS[k].light) === s || lc(COLORS[k].dark) === s) return k;
  return null;
}
function normSets(sets, draft) {
  if (!Array.isArray(sets)) return [];
  return sets.filter(x => x && typeof x === "object").map(x => {
    if (draft) return {
      w: x.w == null ? "" : String(x.w), r: x.r == null ? "" : String(x.r), done: !!x.done,
      pw: x.pw == null ? "" : String(x.pw), pr: x.pr == null ? "" : String(x.pr)
    };
    return { w: numOrNull(x.w), r: numOrNull(x.r) };
  });
}
function normExercises(list, draft) {
  if (!Array.isArray(list)) return [];
  return list.filter(e => e && (e.move || e.name)).map(e => ({ move: String(e.move || e.name), sets: normSets(e.sets, draft) }));
}
function normEntry(e, fallbackPerson) {
  if (!e || typeof e !== "object") return null;
  let date = e.date || e.finishedAt || e.startedAt;
  const dt = new Date(typeof date === "number" ? date : date || Date.now());
  return {
    id: String(e.id || uid("w")),
    person: String(e.person || fallbackPerson),
    date: isNaN(dt) ? new Date().toISOString() : dt.toISOString(),
    exercises: normExercises(e.exercises, false)
  };
}
function migrate(s) {
  const d = defaults();
  if (!s || typeof s !== "object") return d;
  const out = { v: 1 };
  // People
  let people = {};
  if (Array.isArray(s.people)) {
    s.people.forEach((p, i) => { if (p) people[String(p.id || ("p" + i))] = { name: p.name, color: p.color }; });
  } else if (s.people && typeof s.people === "object") {
    for (const [id, p] of Object.entries(s.people)) people[id] = (p && typeof p === "object") ? { name: p.name, color: p.color } : { name: String(p) };
  }
  if (!Object.keys(people).length) people = d.people;
  // Order
  let order = Array.isArray(s.order) ? s.order.map(String).filter(id => people[id]) : [];
  for (const id of Object.keys(people)) if (!order.includes(id)) order.push(id);
  order = [...new Set(order)];
  // Names + colors (unique)
  const used = new Set();
  const pending = [];
  for (const id of order) {
    const p = people[id];
    p.name = (typeof p.name === "string" && p.name.trim()) ? p.name.trim().slice(0, 24) : (id.charAt(0).toUpperCase() + id.slice(1));
    const k = colorKey(p.color);
    if (k && !used.has(k)) { p.color = k; used.add(k); } else pending.push(id);
  }
  for (const id of pending) {
    const p = people[id];
    const pref = lc(p.name) === "erik" ? "red" : lc(p.name) === "dash" ? "yellow" : null;
    const k = (pref && !used.has(pref)) ? pref : (COLOR_KEYS.find(c => !used.has(c)) || "black");
    p.color = k; used.add(k);
  }
  out.people = {}; for (const id of order) out.people[id] = { name: people[id].name, color: people[id].color };
  out.order = order;
  out.active = out.people[s.active] ? s.active : order[0];
  out.view = VIEWS.includes(s.view) ? s.view : "log";
  out.unit = s.unit === "kg" ? "kg" : "lb";
  // Custom movements
  out.custom = [];
  const seen = new Set();
  if (Array.isArray(s.custom)) for (const c of s.custom) {
    const name = typeof c === "string" ? c : c && c.name;
    if (!name || seen.has(lc(name))) continue;
    seen.add(lc(name));
    out.custom.push({ name: String(name).trim(), cat: GROUPS.includes(c && c.cat) ? c.cat : "Full body", bw: !!(c && c.bw) });
  }
  // Drafts
  out.drafts = {};
  const drafts = (s.drafts && typeof s.drafts === "object") ? { ...s.drafts } : {};
  if (s.draft && typeof s.draft === "object" && !drafts[out.active]) drafts[out.active] = s.draft;
  for (const [pid, dr] of Object.entries(drafts)) {
    if (!out.people[pid] || !dr) continue;
    const ex = normExercises(dr.exercises, true);
    if (ex.length) out.drafts[pid] = { startedAt: dr.startedAt || new Date().toISOString(), exercises: ex };
  }
  // Log
  out.gone = Array.isArray(s.gone) ? [...new Set(s.gone.map(String))] : [];
  const gone = new Set(out.gone);
  const ids = new Set();
  out.log = [];
  if (Array.isArray(s.log)) for (const e of s.log) {
    const n = normEntry(e, order[0]);
    if (!n || gone.has(n.id) || ids.has(n.id)) continue;
    ids.add(n.id); out.log.push(n);
  }
  out.lastBackup = s.lastBackup || null;
  return out;
}
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (!raw) return defaults();
  try { return migrate(JSON.parse(raw)); }
  catch (e) {
    try { localStorage.setItem(KEY + ".corrupt-" + Date.now(), raw); } catch (e2) {}
    return defaults();
  }
}
let saveFailed = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); saveFailed = false; }
  catch (e) { if (!saveFailed) { saveFailed = true; toast("Couldn't save — storage is full or blocked"); } }
}

function moveInfo(name) {
  const k = lc(name);
  return LIBRARY.find(m => lc(m.name) === k)
    || (S.custom.find(m => lc(m.name) === k) && { ...S.custom.find(m => lc(m.name) === k), custom: true })
    || { name, cat: "Custom", bw: false, custom: true };
}
function workoutsFor(pid) {
  return S.log.filter(w => w.person === pid).sort((a, b) => b.date.localeCompare(a.date));
}
function lastSession(pid, move) {
  const k = lc(move);
  for (const w of workoutsFor(pid)) {
    const ex = w.exercises.find(e => lc(e.move) === k && e.sets.length);
    if (ex) return { date: w.date, sets: ex.sets };
  }
  return null;
}
function fmtW(w, bw) {
  if (bw) return (w != null && w !== "" && Number(w) !== 0) ? "BW+" + fmtNum(Number(w)) : "BW";
  return (w == null || w === "") ? "0" : fmtNum(Number(w));
}
const fmtSet = (s, bw) => fmtW(s.w, bw) + " × " + fmtNum(s.r);
function thumbHTML(info) {
  if (info.photo != null && info.photo >= 0) {
    const c = info.photo % PHOTO_COLS, r = Math.floor(info.photo / PHOTO_COLS);
    const px = PHOTO_COLS > 1 ? (c / (PHOTO_COLS - 1)) * 100 : 0, py = PHOTO_ROWS > 1 ? (r / (PHOTO_ROWS - 1)) * 100 : 0;
    return `<span class="thumb" role="img" aria-label="${esc(info.name)} photo" style="--cols:${PHOTO_COLS};--rows:${PHOTO_ROWS};background-position:${px.toFixed(4)}% ${py.toFixed(4)}%"></span>`;
  }
  const ini = String(info.name || "?").split(/[\s-]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  return `<span class="thumb none" aria-hidden="true">${esc(ini)}</span>`;
}

/* ================= Theme ================= */
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const c = COLORS[person().color] || COLORS.red;
  const hex = darkMQ.matches ? c.dark : c.light;
  const root = document.documentElement.style;
  root.setProperty("--accent", hex);
  root.setProperty("--on-accent", c.ink);
  const m = $('meta[name="theme-color"]'); if (m) m.setAttribute("content", hex);
}
(darkMQ.addEventListener ? darkMQ.addEventListener("change", applyTheme) : darkMQ.addListener(applyTheme));

/* ================= Render: header ================= */
function subtitle(pid) {
  if (draftOf(pid)) return "Workout in progress";
  const n = S.log.filter(w => w.person === pid).length;
  return n ? plural(n, "workout") + " logged" : "No workouts yet";
}
function renderHeader() {
  const el = $("#lifters");
  el.classList.toggle("many", S.order.length >= 3);
  el.innerHTML = S.order.map(id => {
    const p = S.people[id];
    return `<button class="ltab" role="tab" data-act="lifter" data-pid="${esc(id)}" aria-selected="${id === S.active}">
      <span class="plate" style="--pc:var(--c-${p.color})"></span>
      <span class="txt"><span class="nm">${esc(p.name)}</span><span class="sub">${esc(subtitle(id))}</span></span></button>`;
  }).join("");
  document.querySelectorAll(".views button").forEach(b => {
    if (b.dataset.view === S.view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  const act = el.querySelector('[aria-selected="true"]');
  if (act && S.order.length >= 3) {
    const l = act.offsetLeft - 12, r = act.offsetLeft + act.offsetWidth + 12;
    if (l < el.scrollLeft) el.scrollLeft = l; else if (r > el.scrollLeft + el.clientWidth) el.scrollLeft = r - el.clientWidth;
  }
}

/* ================= Render: main ================= */
function render() {
  applyTheme();
  renderHeader();
  const main = $("#main");
  if (S.view === "history") main.innerHTML = historyHTML();
  else if (S.view === "settings") main.innerHTML = settingsHTML();
  else main.innerHTML = logHTML();
  renderBar();
}
function renderBar() {
  const bar = $("#bar");
  const d = S.view === "log" && draftOf();
  if (!d) { bar.hidden = true; bar.innerHTML = ""; return; }
  bar.hidden = false;
  const { done, total } = countSets(d);
  bar.innerHTML = `<div class="in">
    <div class="count" id="setCount"><b>${done}/${total}</b>sets done</div>
    <button class="btn ghost" data-act="discard">Discard</button>
    <button class="btn primary" data-act="finish">Finish workout</button></div>`;
}
function countSets(d) {
  let done = 0, total = 0;
  for (const e of d.exercises) for (const s of e.sets) { total++; if (s.done) done++; }
  return { done, total };
}
function updateCount() {
  const d = draftOf(); const el = $("#setCount");
  if (d && el) { const { done, total } = countSets(d); el.innerHTML = `<b>${done}/${total}</b>sets done`; }

function historyHTML() {
  const p = person();
  const ws = workoutsFor(S.active);
  if (!ws.length) {
    return `<div class="card empty">${MARK}<div class="big">No history yet</div>
      <p>Finished workouts for ${esc(p.name)} will show up here, along with best sets.</p>
      <button class="btn primary block" data-act="view" data-view="log">Go to Log</button></div>`;
  }
  // Best sets
  const best = new Map();
  for (const w of ws) for (const ex of w.exercises) {
    const info = moveInfo(ex.move);
    const k = lc(ex.move);
    for (const s of ex.sets) {
      if (!s.r) continue;
      const cur = best.get(k);
      const cand = { move: ex.move, bw: info.bw, w: s.w, r: s.r, date: w.date };
      let better = !cur;
      if (cur) {
        const cw = cur.w || 0, nw = s.w || 0;
        if (info.bw) better = s.r > cur.r || (s.r === cur.r && nw > cw);
        else better = nw > cw || (nw === cw && s.r > cur.r);
      }
      if (better) best.set(k, cand);
    }
  }
  const bests = [...best.values()].sort((a, b) => a.move.localeCompare(b.move)).map(b => `
    <div class="best"><div class="n">${esc(b.move)}<small>${b.bw ? "Most reps" : "Heaviest"} · ${esc(fmtDate(b.date))}</small></div>
    <div class="v">${esc(fmtSet(b, b.bw))}${b.bw ? "" : ` <small style="font-size:14px;color:var(--muted)">${S.unit}</small>`}</div></div>`).join("");
  const list = ws.map(w => {
    const items = w.exercises.map(ex => {
      const bw = moveInfo(ex.move).bw;
      return `<li><b>${esc(ex.move)}</b>${esc(ex.sets.map(s => fmtSet(s, bw)).join(", "))}</li>`;
    }).join("");
    const sets = w.exercises.reduce((n, e) => n + e.sets.length, 0);
    return `<article class="card wk"><div class="wk-head"><div class="d">${esc(fmtDate(w.date))}<small>${esc(ago(w.date))} · ${plural(sets, "set")}</small></div>
      <button class="iconbtn" data-act="delwk" data-id="${esc(w.id)}" aria-label="Delete workout from ${esc(fmtDate(w.date))}">${ICON.trash}</button></div>
      <ul>${items}</ul></article>`;
  }).join("");
  return `<h2>Best sets · ${esc(p.name)}</h2><div class="card bests">${bests || '<div class="noresults">No sets yet.</div>'}</div>
    <h2>Workouts (${ws.length})</h2>${list}`;
}

function submitCustom(ev) {
  ev.preventDefault();

  if (exists && !S.custom.includes(exists)) {
    toast(`“${exists.name}” is already in the library`);
  } else if (exists) {

/* ================= Actions ================= */
function ensureDraft() {
  if (!S.drafts[S.active] || !S.drafts[S.active].exercises.length) S.drafts[S.active] = { startedAt: new Date().toISOString(), exercises: [] };
  return S.drafts[S.active];
}
function addMove(move) {
  const d = ensureDraft();
  const last = lastSession(S.active, move);
  const sets = [];
  for (let i = 0; i < 3; i++) {
    const ls = last ? last.sets[Math.min(i, last.sets.length - 1)] : null;
    sets.push({ w: "", r: "", done: false, pw: ls && ls.w != null ? fmtNum(ls.w) : "", pr: ls && ls.r != null ? fmtNum(ls.r) : "" });
  }
  d.exercises.push({ move, sets });
  S.view = "log";
  save(); render();
  requestAnimationFrame(() => {
    const cards = document.querySelectorAll(".ex");
    const c = cards[cards.length - 1];
    if (c) c.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
  });
}
function setFromEl(el) {
  const exEl = el.closest(".ex"), rowEl = el.closest(".row");
  const d = draftOf(); if (!d || !exEl) return {};
  const ex = d.exercises[+exEl.dataset.ei];
  return { d, ex, ei: +exEl.dataset.ei, si: rowEl ? +rowEl.dataset.si : -1, set: rowEl && ex ? ex.sets[+rowEl.dataset.si] : null };
}
function sanitize(v, decimal) {
  if (decimal) {
    v = v.replace(/,/g, ".").replace(/[^0-9.]/g, "");
    const i = v.indexOf("."); if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, "");
    return v.slice(0, 7);
  }
  return v.replace(/[^0-9]/g, "").slice(0, 4);
}

async function finishWorkout() {
  const d = draftOf(); if (!d) return;
  const exercises = [];
  for (const ex of d.exercises) {
    const sets = ex.sets.map(s => ({ w: numOrNull(s.w), r: numOrNull(s.r) })).filter(s => s.r != null && s.r > 0);
    if (sets.length) exercises.push({ move: ex.move, sets });
  }
  if (!exercises.length) {
    await alertBox("Nothing to save yet", "Enter reps (or tap a checkmark) on at least one set, then finish.");
    return;
  }
  const dropped = countSets(d).total - exercises.reduce((n, e) => n + e.sets.length, 0);
  if (dropped > 0) {
    const ok = await confirmBox("Finish workout?", `${plural(dropped, "set")} without reps will be left out.`, "Finish", false);
    if (!ok) return;
  }
  S.log.push({ id: uid("w"), person: S.active, date: new Date().toISOString(), exercises });
  delete S.drafts[S.active];
  S.view = "history";
  save(); render(); window.scrollTo(0, 0);
  toast(`Saved · ${plural(exercises.length, "movement")}, ${plural(exercises.reduce((n, e) => n + e.sets.length, 0), "set")}`);
}

async function exportBackup() {
  const payload = { app: "platemates", version: 1, exportedAt: new Date().toISOString(), data: { ...S, view: "log" } };
  const json = JSON.stringify(payload, null, 1);
  const name = `platemates-backup-${localYMD()}.json`;
  const markDone = () => { S.lastBackup = new Date().toISOString(); save(); if (S.view === "settings") render(); };
  let file = null;
  try { file = new File([json], name, { type: "application/json" }); } catch (e) {}
  if (file && navigator.canShare && navigator.share) {
    let can = false; try { can = navigator.canShare({ files: [file] }); } catch (e) {}
    if (can) {
      try { await navigator.share({ files: [file], title: "PlateMates backup" }); markDone(); toast("Backup shared"); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
  }
  try {
    const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    markDone(); toast("Backup downloaded");
  } catch (e) { alertBox("Export failed", "Your browser blocked the download."); }
}

async function restoreFrom(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { return alertBox("Can't read that file", "It isn't a valid backup file."); }
  const app = obj && lc(obj.app);
  if (app !== "platemates" && app !== "liftlog") return alertBox("Not a PlateMates backup", "Choose a file exported from PlateMates.");
  const raw = obj.data && typeof obj.data === "object" ? obj.data : obj;
  const inc = migrate(raw);
  let addedPeople = 0, added = 0, already = 0, skipped = 0, addedCustom = 0;
  // People: map backup ids to local ids (same id, or same name)
  const map = {};
  for (const id of inc.order) {
    if (S.people[id]) { map[id] = id; continue; }
    const byName = S.order.find(o => lc(S.people[o].name) === lc(inc.people[id].name));
    if (byName) { map[id] = byName; continue; }
    if (S.order.length >= MAX_LIFTERS) continue;
    const used = new Set(S.order.map(o => S.people[o].color));
    const color = used.has(inc.people[id].color) ? COLOR_KEYS.find(c => !used.has(c)) : inc.people[id].color;
    S.people[id] = { name: inc.people[id].name, color }; S.order.push(id); map[id] = id; addedPeople++;
  }
  for (const c of inc.custom) if (![...LIBRARY, ...S.custom].some(m => lc(m.name) === lc(c.name))) { S.custom.push(c); addedCustom++; }
  const gone = new Set([...S.gone, ...inc.gone]);
  S.gone = [...gone];
  const have = new Set(S.log.map(w => w.id));
  for (const w of inc.log) {
    if (gone.has(w.id)) continue;
    if (have.has(w.id)) { already++; continue; }
    if (!map[w.person]) { skipped++; continue; }
    S.log.push({ ...w, person: map[w.person] }); have.add(w.id); added++;
  }
  S.log = S.log.filter(w => !gone.has(w.id));
  save(); render();
  const parts = [`${plural(added, "workout")} added`, `${already} already here`];
  if (addedPeople) parts.push(`${plural(addedPeople, "lifter")} added`);
  if (addedCustom) parts.push(`${plural(addedCustom, "custom movement")} added`);
  if (skipped) parts.push(`${skipped} skipped (no room for their lifter)`);
  alertBox("Restore complete", parts.join(" · ") + ".");
}

/* ================= Dialogs + toast ================= */
function dialog(title, body, okLabel, cancelLabel, danger) {
  return new Promise(res => {
    const root = $("#modalRoot");
    const prev = document.activeElement;
    root.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="dlgT"><div class="dialog">
      <h3 id="dlgT">${esc(title)}</h3><p>${esc(body)}</p><div class="btnrow">
      ${cancelLabel ? `<button class="btn ghost" data-r="0">${esc(cancelLabel)}</button>` : ""}
      <button class="btn primary${danger ? " danger" : ""}" data-r="1">${esc(okLabel)}</button></div></div></div>`;
    const done = (v) => { root.innerHTML = ""; document.removeEventListener("keydown", key); if (prev && prev.focus) try { prev.focus({ preventScroll: true }); } catch (e) {} res(v); };
    const key = (e) => { if (e.key === "Escape") done(false); };
    document.addEventListener("keydown", key);
    root.querySelector(".modal").addEventListener("click", (e) => {
      const b = e.target.closest("[data-r]");
      if (b) done(b.dataset.r === "1"); else if (e.target.classList.contains("modal")) done(false);
    });
    root.querySelector('[data-r="1"]').focus();
  });
}
const confirmBox = (t, b, ok = "OK", danger = true) => dialog(t, b, ok, "Cancel", danger);
const alertBox = (t, b) => dialog(t, b, "OK", null, false);
let toastT;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ================= Events ================= */
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act;
  switch (act) {
    case "view":
      S.view = el.dataset.view; save(); render(); window.scrollTo(0, 0); break;
    case "lifter":
      if (S.active !== el.dataset.pid) { S.active = el.dataset.pid; save(); render(); window.scrollTo(0, 0); }
      break;
    case "openSheet": openSheet("log"); break;
    case "closeSheet": closeSheet(); break;
    case "chip": sheet.cat = el.dataset.cat; renderSheet(); break;
    case "sheetform": sheet.form = sheet.q.trim() || true; renderSheet(); setTimeout(() => { const n = $("#cName"); if (n && !n.value) n.focus(); }, 50); break;
    case "formcancel": if (sheet.from === "log") { sheet.form = false; renderSheet(); } else closeSheet(); break;
    case "newcustom": openSheet("settings", true); setTimeout(() => { const n = $("#cName"); if (n) n.focus(); }, 50); break;
    case "pick": { const m = el.dataset.move; closeSheet(); addMove(m); break; }
    case "done": {
      const { set, ei, si } = setFromEl(el); if (!set) return;
      if (!set.done) {
        if (set.w === "" && set.pw !== "") set.w = set.pw;
        if (set.r === "" && set.pr !== "") set.r = set.pr;
        if (set.r === "" || Number(set.r) <= 0) {
          save(); render();
          const inp = document.querySelector(`.ex[data-ei="${ei}"] .row[data-si="${si}"] [data-f="r"]`);
          if (inp) inp.focus();
          toast("Enter reps for this set first"); return;
        }
        set.done = true;
        if (navigator.vibrate) try { navigator.vibrate(12); } catch (x) {}
      } else set.done = false;
      save();
      const row = el.closest(".row");
      row.classList.toggle("done", set.done);
      el.setAttribute("aria-pressed", set.done);
      row.querySelector('[data-f="w"]').value = set.w;
      row.querySelector('[data-f="r"]').value = set.r;
      updateCount(); break;
    }
    case "rmset": {
      const { d, ex, si } = setFromEl(el); if (!ex) return;
      ex.sets.splice(si, 1);
      save(); render(); break;
    }
    case "addset": {
      const { ex } = setFromEl(el); if (!ex) return;
      const prev = ex.sets[ex.sets.length - 1];
      const last = lastSession(S.active, ex.move);
      const ls = last && last.sets[ex.sets.length];
      ex.sets.push({
        w: prev ? prev.w : "", r: prev ? prev.r : "", done: false,
        pw: ls && ls.w != null ? fmtNum(ls.w) : (prev ? prev.pw : ""),
        pr: ls && ls.r != null ? fmtNum(ls.r) : (prev ? prev.pr : "")
      });
      save(); render(); break;
    }
    case "rmex": {
      const { d, ex, ei } = setFromEl(el); if (!ex) return;
      const has = ex.sets.some(s => s.done || s.w !== "" || s.r !== "");
      if (has && !(await confirmBox(`Remove ${ex.move}?`, "Its sets in this workout will be cleared.", "Remove"))) return;
      d.exercises.splice(ei, 1);
      if (!d.exercises.length) delete S.drafts[S.active];
      save(); render(); break;
    }
    case "discard":
      if (await confirmBox("Discard workout?", `Everything in ${person().name}'s workout in progress will be lost.`, "Discard")) {
        delete S.drafts[S.active]; save(); render(); toast("Workout discarded");
      }
      break;
    case "finish": finishWorkout(); break;
    case "delwk": {
      const w = S.log.find(x => x.id === el.dataset.id); if (!w) return;
      if (await confirmBox("Delete this workout?", `${fmtDate(w.date)} · ${plural(w.exercises.length, "movement")}. This can't be undone.`, "Delete")) {
        S.log = S.log.filter(x => x.id !== w.id); if (!S.gone.includes(w.id)) S.gone.push(w.id);
        save(); render(); toast("Workout deleted");
      }
      break;
    }
    case "color": {
      const p = S.people[el.dataset.pid]; if (!p) return;
      p.color = el.dataset.color; save(); render(); break;
    }
    case "addlifter": {
      if (S.order.length >= MAX_LIFTERS) return;
      const used = new Set(S.order.map(o => S.people[o].color));
      const id = uid("p");
      let n = S.order.length + 1, name = "Lifter " + n;
      while (S.order.some(o => lc(S.people[o].name) === lc(name))) name = "Lifter " + (++n);
      S.people[id] = { name, color: COLOR_KEYS.find(c => !used.has(c)) };
      S.order.push(id); save(); render();
      setTimeout(() => { const i = document.querySelector(`input[data-f="name"][data-pid="${id}"]`); if (i) { i.focus(); i.select(); } }, 30);
      break;
    }
    case "rmlifter": {
      const id = el.dataset.pid, p = S.people[id]; if (!p || S.order.length < 2) return;
      const n = S.log.filter(w => w.person === id).length;
      const extra = draftOf(id) ? " and the workout in progress" : "";
      const msg = n ? `This permanently deletes ${plural(n, "workout")}${extra} for ${p.name}.` : `${p.name} has no saved workouts${extra ? ", but the workout in progress will be lost" : ""}.`;
      if (!(await confirmBox(`Remove ${p.name}?`, msg, "Remove"))) return;
      for (const w of S.log) if (w.person === id && !S.gone.includes(w.id)) S.gone.push(w.id);
      S.log = S.log.filter(w => w.person !== id);
      delete S.people[id]; delete S.drafts[id];
      S.order = S.order.filter(o => o !== id);
      if (S.active === id) S.active = S.order[0];
      save(); render(); toast(`${p.name} removed`); break;
    }
    case "unit": S.unit = el.dataset.unit; save(); render(); break;
    case "delcustom": {
      const i = +el.dataset.i, c = S.custom[i]; if (!c) return;
      if (await confirmBox(`Delete “${c.name}”?`, "It's removed from the picker. Past workouts that used it are kept.", "Delete")) {
        S.custom.splice(i, 1); save(); render();
      }
      break;
    }
    case "export": exportBackup(); break;
    case "restore": $("#restoreFile").value = ""; $("#restoreFile").click(); break;
  }
});

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "msearch") { sheet.q = el.value; $("#mlist").innerHTML = sheetListHTML(); return; }
  const f = el.dataset && el.dataset.f;
  if (f === "w" || f === "r") {
    const { set } = setFromEl(el); if (!set) return;
    const v = sanitize(el.value, f === "w");
    if (v !== el.value) el.value = v;
    set[f] = v;
    save(); return;
  }
  if (f === "name") {
    const p = S.people[el.dataset.pid]; if (!p) return;
    const v = el.value.replace(/\s+/g, " ").slice(0, 24);
    if (v.trim()) { p.name = v.trim(); save(); renderHeader(); }
  }
});
document.addEventListener("focusout", (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.f === "name") {
    const p = S.people[el.dataset.pid];
    if (p && !el.value.trim()) el.value = p.name;
  }
  setTimeout(() => {
    const a = document.activeElement;
    document.body.classList.toggle("typing", !!(a && a.matches && a.matches("input:not([type=checkbox]),select,textarea")));
  }, 0);
});
document.addEventListener("focusin", (e) => {
  if (e.target.matches && e.target.matches("input:not([type=checkbox]),select,textarea")) document.body.classList.add("typing");
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && sheet && !$("#modalRoot").innerHTML) closeSheet();
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.f === "name") e.target.blur();
});
$("#restoreFile").addEventListener("change", (e) => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => restoreFrom(String(r.result));
  r.onerror = () => alertBox("Can't read that file", "Try choosing it again.");
  r.readAsText(file);
});
window.addEventListener("storage", (e) => { if (e.key === KEY) { S = load(); render(); } });

/* ================= Boot ================= */
save();
render();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
